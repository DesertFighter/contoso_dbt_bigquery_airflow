# Source -> Snapshot: Contoso current-state tables
version: 2

snapshots:
  - name: snaps_DimAccount
    relation: source('contoso_raw', 'DimAccount')
    config:
      database: contoso-dbt-airflow
      schema: snapshots
      alias: snp_DimAccount
      unique_key: AccountKey
      strategy: timestamp
      updated_at: UpdateDate
      hard_deletes: invalidate
      snapshot_meta_column_names:
        dbt_valid_from: ValidFrom
        dbt_valid_to: ValidTo
        dbt_updated_at: UpdatedAt
        dbt_scd_id: SnapshotSCDID
      tags: [snapshot, contoso]

