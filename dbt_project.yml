
name: 'contoso_dbt_bigquery_airflow'
version: '1.0.0'
config-version: 2

profile: 'default'

# Project directories
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"

clean-targets:
  - "target"
  - "dbt_packages"

# dbt_date package configuration
vars:
  "dbt_date:time_zone": "UTC"

# Medallion Architecture
models:
  contoso_dbt_bigquery_airflow:

    # Bronze Layer
    bronze_layer:
      +materialized: table
      +schema: bronze
      +tags: ["bronze"]

    # Silver Layer
    silver_layer:
      +materialized: table
      +schema: silver
      +tags: ["silver"]

    # Gold Layer
    gold_layer:
      +materialized: materialized_view
      +schema: gold
      +tags: ["gold"]
